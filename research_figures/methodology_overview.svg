<text x="409.0" y="187" font-family="Arial, Helvetica, sans-serif" font-size="20.5" font-weight="400" fill="#203047" text-anchor="middle">Controlled streams</text>
<text x="409.0" y="211" font-family="Arial, Helvetica, sans-serif" font-size="20.5" font-weight="400" fill="#203047" text-anchor="middle">Natural case studies</text>
