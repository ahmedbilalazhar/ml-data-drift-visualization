<text x="671.0" y="187" font-family="Arial, Helvetica, sans-serif" font-size="20.5" font-weight="400" fill="#203047" text-anchor="middle">Fit before final testing</text>
<text x="671.0" y="211" font-family="Arial, Helvetica, sans-serif" font-size="20.5" font-weight="400" fill="#203047" text-anchor="middle">Freeze partitions</text>
