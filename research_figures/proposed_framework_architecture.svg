<title id="title">Cohort-aligned monitoring data flow</title>
<desc id="desc">Original swimlane data-flow architecture. Rectangles are computations, cylinders retain records, and a diamond tests label eligibility. A read-only assessment boundary isolates generator truth from the monitor.</desc>
